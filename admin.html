<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin — AI Asisten SOP PLTA Sipansihaporas</title>
<style>
  :root {
    --bg: #0e1a22;
    --panel: #142530;
    --panel-2: #1a2e3a;
    --border: #24404e;
    --text: #e7eef2;
    --muted: #85a0ac;
    --accent: #e3a008;
    --accent-dim: #7a5a12;
    --teal: #2fa6a0;
    --danger: #d9534f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand .eyebrow { font-size: 11px; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; font-weight: 600; }
  .brand .title { font-size: 15px; font-weight: 700; }

  #main { max-width: 720px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }

  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
  label:first-child { margin-top: 0; }

  input[type="text"], input[type="password"], select, textarea {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; line-height: 1.4; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; }

  button {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    border-radius: 7px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #241a03; }
  .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: rgba(217,83,79,0.15); color: #f2b8b5; border: 1px solid var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  h2 { font-size: 15px; margin: 0 0 4px 0; }
  h3 { font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px 0; }

  .doc-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .doc-row:last-child { border-bottom: none; }
  .doc-row .info { font-size: 13.5px; }
  .doc-row .info .nomor { color: var(--teal); font-size: 11.5px; display: block; }
  .doc-row .actions { display: flex; gap: 6px; }
  .doc-row .actions button { padding: 6px 10px; font-size: 12px; }

  .status-msg { font-size: 12.5px; margin-top: 8px; }
  .status-msg.error { color: #f2b8b5; }
  .status-msg.ok { color: var(--teal); }
  .status-msg.loading { color: var(--muted); font-style: italic; }

  .step-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--panel-2); }
  .step-card img { max-width: 100%; border-radius: 6px; margin-top: 8px; display: block; }

  .hidden { display: none !important; }

  #login-screen { max-width: 340px; margin: 15vh auto 0; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="eyebrow mono">Admin</span>
    <span class="title">AI Asisten SOP — PLTA Sipansihaporas</span>
  </div>
  <button class="btn-secondary hidden" id="logout-btn">Keluar</button>
</header>

<div id="main">

  <!-- LOGIN -->
  <div id="login-screen" class="card">
    <h2>Login Admin</h2>
    <label for="login-password">Password</label>
    <input type="password" id="login-password" placeholder="Masukkan password admin">
    <div class="btn-row">
      <button class="btn-primary" id="login-btn">Masuk</button>
    </div>
    <div id="login-status" class="status-msg"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-screen" class="hidden">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Daftar IK/SOP</h2>
        <button class="btn-primary" id="new-doc-btn">+ Tambah IK Baru</button>
      </div>
      <div id="doc-list" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- EDITOR -->
  <div id="editor-screen" class="hidden">
    <button class="btn-secondary" id="back-btn" style="margin-bottom:12px;">&larr; Kembali ke Daftar</button>

    <div class="card">
      <h3>Metadata Dokumen</h3>
      <label for="f-nomor-ik">Nomor IK</label>
      <input type="text" id="f-nomor-ik" placeholder="IKPD-306-14.2.1.4.a.h-006">
      <label for="f-judul">Judul</label>
      <input type="text" id="f-judul" placeholder="PELAKSANAAN ...">
      <label for="f-unit">Unit</label>
      <select id="f-unit">
        <option value="1">Unit 1</option>
        <option value="2">Unit 2</option>
      </select>
      <label for="f-lokasi">Kode Lokasi</label>
      <input type="text" id="f-lokasi" value="SPH">
      <label for="f-status">Status Dokumen</label>
      <select id="f-status">
        <option value="resmi">Resmi</option>
        <option value="percobaan_fixed">Percobaan/Fixed (belum resmi)</option>
      </select>
      <div class="btn-row">
        <button class="btn-primary" id="save-doc-btn">Simpan Dokumen</button>
        <button class="btn-danger hidden" id="delete-doc-btn">Hapus Dokumen Ini</button>
      </div>
      <div id="doc-status" class="status-msg"></div>
    </div>

    <div id="sections-container" class="hidden"></div>

    <div id="steps-container" class="card hidden">
      <h3>Langkah Prosedur</h3>
      <div id="steps-list"></div>
      <div class="btn-row">
        <button class="btn-secondary" id="add-step-btn">+ Tambah Langkah</button>
      </div>
    </div>

  </div>

</div>

<script>
  const API = '/admin/api';

  const SECTION_DEFS = [
    { key: 'ringkasan', label: 'Tujuan / Ruang Lingkup / Definisi', section_type: 'ringkasan' },
    { key: 'dokumen_terkait', label: 'Dokumen Terkait', section_type: 'referensi' },
    { key: 'sumber_daya', label: 'Sumber Daya (SDM & Alat)', section_type: 'referensi' },
    { key: 'risiko', label: 'Identifikasi & Mitigasi Risiko (K3)', section_type: 'referensi' },
    { key: 'durasi', label: 'Durasi & Parameter Keberhasilan', section_type: 'referensi' },
    { key: 'tindakan_akhir', label: 'Tindakan Akhir', section_type: 'tindakan_akhir' },
    { key: 'lampiran', label: 'Lampiran', section_type: 'referensi' },
  ];

  let state = { docId: null, sections: {}, steps: [] };

  const loginScreen = document.getElementById('login-screen');
  const dashboardScreen = document.getElementById('dashboard-screen');
  const editorScreen = document.getElementById('editor-screen');
  const logoutBtn = document.getElementById('logout-btn');

  function showScreen(name) {
    loginScreen.classList.toggle('hidden', name !== 'login');
    dashboardScreen.classList.toggle('hidden', name !== 'dashboard');
    editorScreen.classList.toggle('hidden', name !== 'editor');
    logoutBtn.classList.toggle('hidden', name === 'login');
  }

  async function checkAuth() {
    const res = await fetch(API + '/check');
    if (res.ok) { showScreen('dashboard'); loadDocuments(); }
    else showScreen('login');
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    const password = document.getElementById('login-password').value;
    const statusEl = document.getElementById('login-status');
    statusEl.textContent = 'Memeriksa...';
    statusEl.className = 'status-msg loading';
    try {
      const res = await fetch(API + '/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (!res.ok) { statusEl.textContent = data.error; statusEl.className = 'status-msg error'; return; }
      statusEl.textContent = '';
      showScreen('dashboard');
      loadDocuments();
    } catch (err) {
      statusEl.textContent = err.message; statusEl.className = 'status-msg error';
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await fetch(API + '/logout', { method: 'POST' });
    showScreen('login');
  });

  async function loadDocuments() {
    const listEl = document.getElementById('doc-list');
    listEl.textContent = 'Memuat...';
    const res = await fetch(API + '/documents');
    const data = await res.json();
    if (!res.ok) { listEl.textContent = 'Gagal memuat: ' + data.error; return; }

    listEl.innerHTML = '';
    data.documents.forEach((doc) => {
      const row = document.createElement('div');
      row.className = 'doc-row';
      const jumlahChunk = doc.chunks?.[0]?.count ?? 0;
      row.innerHTML = `
        <div class="info">
          <span class="nomor mono">${doc.nomor_ik} — Unit ${doc.unit} / ${doc.lokasi}</span>
          ${doc.judul} <span style="color:var(--muted)">(${jumlahChunk} chunk)</span>
        </div>
        <div class="actions">
          <button class="btn-secondary" data-edit="${doc.id}">Edit</button>
        </div>
      `;
      listEl.appendChild(row);
    });

    listEl.querySelectorAll('[data-edit]').forEach((btn) => {
      btn.addEventListener('click', () => openEditor(btn.dataset.edit));
    });
  }

  document.getElementById('new-doc-btn').addEventListener('click', () => openEditor(null));
  document.getElementById('back-btn').addEventListener('click', () => { showScreen('dashboard'); loadDocuments(); });

  async function openEditor(docId) {
    state = { docId: null, sections: {}, steps: [] };
    SECTION_DEFS.forEach((s) => { state.sections[s.key] = { dbId: null, text: '' }; });

    document.getElementById('f-nomor-ik').value = '';
    document.getElementById('f-judul').value = '';
    document.getElementById('f-unit').value = '1';
    document.getElementById('f-lokasi').value = 'SPH';
    document.getElementById('f-status').value = 'resmi';
    document.getElementById('sections-container').classList.add('hidden');
    document.getElementById('steps-container').classList.add('hidden');
    document.getElementById('delete-doc-btn').classList.add('hidden');
    document.getElementById('doc-status').textContent = '';

    if (docId) {
      const res = await fetch(API + '/documents/' + docId);
      const data = await res.json();
      if (!res.ok) { alert('Gagal memuat dokumen: ' + data.error); return; }

      state.docId = docId;
      document.getElementById('f-nomor-ik').value = data.document.nomor_ik;
      document.getElementById('f-judul').value = data.document.judul;
      document.getElementById('f-unit').value = data.document.unit;
      document.getElementById('f-lokasi').value = data.document.lokasi;
      document.getElementById('f-status').value = data.document.status_dokumen;

      data.chunks.forEach((c) => {
        const matchedSection = SECTION_DEFS.find((s) => s.label === c.label);
        if (matchedSection && c.section_type !== 'prosedur') {
          state.sections[matchedSection.key] = { dbId: c.id, text: c.text };
        } else {
          state.steps.push({ dbId: c.id, label: c.label, text: c.text, photo_url: c.metadata?.photo_url || null });
        }
      });

      renderSections();
      renderSteps();
      document.getElementById('sections-container').classList.remove('hidden');
      document.getElementById('steps-container').classList.remove('hidden');
      document.getElementById('delete-doc-btn').classList.remove('hidden');
    }

    showScreen('editor');
  }

  document.getElementById('save-doc-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('doc-status');
    const payload = {
      nomor_ik: document.getElementById('f-nomor-ik').value.trim(),
      judul: document.getElementById('f-judul').value.trim(),
      unit: document.getElementById('f-unit').value,
      lokasi: document.getElementById('f-lokasi').value.trim(),
      status_dokumen: document.getElementById('f-status').value,
    };
    if (!payload.nomor_ik || !payload.judul) {
      statusEl.textContent = 'Nomor IK dan Judul wajib diisi.';
      statusEl.className = 'status-msg error';
      return;
    }

    statusEl.textContent = 'Menyimpan...';
    statusEl.className = 'status-msg loading';

    try {
      let res, data;
      if (state.docId) {
        res = await fetch(API + '/documents/' + state.docId, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
        });
        data = await res.json();
      } else {
        res = await fetch(API + '/documents', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
        });
        data = await res.json();
        if (res.ok) state.docId = data.id;
      }

      if (!res.ok) { statusEl.textContent = 'Gagal: ' + data.error; statusEl.className = 'status-msg error'; return; }

      statusEl.textContent = 'Tersimpan.';
      statusEl.className = 'status-msg ok';
      const secContainer = document.getElementById('sections-container');
      secContainer.classList.remove('hidden');
      document.getElementById('steps-container').classList.remove('hidden');
      document.getElementById('delete-doc-btn').classList.remove('hidden');
      if (secContainer.children.length === 0) {
        renderSections();
        renderSteps();
      }
    } catch (err) {
      statusEl.textContent = err.message; statusEl.className = 'status-msg error';
    }
  });

  document.getElementById('delete-doc-btn').addEventListener('click', async () => {
    if (!confirm('Yakin hapus dokumen ini beserta seluruh chunk-nya? Tindakan ini tidak bisa dibatalkan.')) return;
    const res = await fetch(API + '/documents/' + state.docId, { method: 'DELETE' });
    const data = await res.json();
    if (!res.ok) { alert('Gagal hapus: ' + data.error); return; }
    showScreen('dashboard');
    loadDocuments();
  });

  function renderSections() {
    const container = document.getElementById('sections-container');
    container.innerHTML = '';
    SECTION_DEFS.forEach((def) => {
      const sec = state.sections[def.key];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${def.label}</h3>
        <textarea data-section="${def.key}" rows="4">${sec.text || ''}</textarea>
        <div class="btn-row">
          <button class="btn-primary" data-save-section="${def.key}">${sec.dbId ? 'Update' : 'Simpan'}</button>
        </div>
        <div class="status-msg" data-status-section="${def.key}"></div>
      `;
      container.appendChild(card);
    });

    container.querySelectorAll('[data-save-section]').forEach((btn) => {
      btn.addEventListener('click', () => saveSection(btn.dataset.saveSection));
    });
  }

  async function saveSection(key) {
    const def = SECTION_DEFS.find((s) => s.key === key);
    const textarea = document.querySelector(`textarea[data-section="${key}"]`);
    const statusEl = document.querySelector(`[data-status-section="${key}"]`);
    const text = textarea.value.trim();
    if (!text) { statusEl.textContent = 'Isi teks dulu.'; statusEl.className = 'status-msg error'; return; }

    statusEl.textContent = 'Menyimpan & membuat embedding, mohon tunggu...';
    statusEl.className = 'status-msg loading';

    const sec = state.sections[key];
    try {
      let res, data;
      if (sec.dbId) {
        res = await fetch(API + '/chunks/' + sec.dbId, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label: def.label, text, section_type: def.section_type }),
        });
        data = await res.json();
      } else {
        res = await fetch(API + '/documents/' + state.docId + '/chunks', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label: def.label, text, section_type: def.section_type }),
        });
        data = await res.json();
        if (res.ok) sec.dbId = data.id;
      }
      sec.text = text;
      if (!res.ok) { statusEl.textContent = 'Gagal: ' + data.error; statusEl.className = 'status-msg error'; return; }
      statusEl.textContent = 'Tersimpan.';
      statusEl.className = 'status-msg ok';
      renderSections();
    } catch (err) {
      statusEl.textContent = err.message; statusEl.className = 'status-msg error';
    }
  }

  function renderSteps() {
    const listEl = document.getElementById('steps-list');
    listEl.innerHTML = '';
    state.steps.forEach((step, idx) => {
      const card = document.createElement('div');
      card.className = 'step-card';
      card.innerHTML = `
        <label>Judul Langkah</label>
        <input type="text" data-step-label="${idx}" value="${step.label ? step.label.replace(/"/g, '&quot;') : ''}" placeholder="misal: Buka Guide Vane perlahan">
        <label>Deskripsi Langkah</label>
        <textarea data-step-text="${idx}" rows="3">${step.text || ''}</textarea>
        <label>Foto (opsional)</label>
        <input type="file" accept="image/*" data-step-photo="${idx}">
        ${step.photo_url ? `<img src="${step.photo_url}" alt="Foto langkah">` : ''}
        <div class="btn-row">
          <button class="btn-primary" data-save-step="${idx}">${step.dbId ? 'Update' : 'Simpan'} Langkah</button>
          <button class="btn-danger" data-delete-step="${idx}">Hapus Langkah</button>
        </div>
        <div class="status-msg" data-status-step="${idx}"></div>
      `;
      listEl.appendChild(card);
    });

    listEl.querySelectorAll('[data-save-step]').forEach((btn) => {
      btn.addEventListener('click', () => saveStep(parseInt(btn.dataset.saveStep, 10)));
    });
    listEl.querySelectorAll('[data-delete-step]').forEach((btn) => {
      btn.addEventListener('click', () => deleteStep(parseInt(btn.dataset.deleteStep, 10)));
    });
  }

  document.getElementById('add-step-btn').addEventListener('click', () => {
    state.steps.push({ dbId: null, label: '', text: '', photo_url: null });
    renderSteps();
  });

  async function saveStep(idx) {
    const step = state.steps[idx];
    const label = document.querySelector(`[data-step-label="${idx}"]`).value.trim();
    const text = document.querySelector(`[data-step-text="${idx}"]`).value.trim();
    const fileInput = document.querySelector(`[data-step-photo="${idx}"]`);
    const statusEl = document.querySelector(`[data-status-step="${idx}"]`);

    if (!label || !text) { statusEl.textContent = 'Judul dan deskripsi wajib diisi.'; statusEl.className = 'status-msg error'; return; }

    statusEl.textContent = 'Menyimpan...';
    statusEl.className = 'status-msg loading';

    try {
      let photoUrl = step.photo_url;
      if (fileInput.files && fileInput.files[0]) {
        statusEl.textContent = 'Mengunggah foto...';
        const formData = new FormData();
        formData.append('photo', fileInput.files[0]);
        const uploadRes = await fetch(API + '/upload-photo', { method: 'POST', body: formData });
        const uploadData = await uploadRes.json();
        if (!uploadRes.ok) { statusEl.textContent = 'Gagal upload foto: ' + uploadData.error; statusEl.className = 'status-msg error'; return; }
        photoUrl = uploadData.url;
      }

      statusEl.textContent = 'Membuat embedding & menyimpan langkah, mohon tunggu...';

      let res, data;
      if (step.dbId) {
        res = await fetch(API + '/chunks/' + step.dbId, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label, text, section_type: 'prosedur', photo_url: photoUrl }),
        });
        data = await res.json();
      } else {
        res = await fetch(API + '/documents/' + state.docId + '/chunks', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label, text, section_type: 'prosedur', photo_url: photoUrl }),
        });
        data = await res.json();
        if (res.ok) step.dbId = data.id;
      }

      if (!res.ok) { statusEl.textContent = 'Gagal: ' + data.error; statusEl.className = 'status-msg error'; return; }

      step.label = label; step.text = text; step.photo_url = photoUrl;
      statusEl.textContent = 'Tersimpan.';
      statusEl.className = 'status-msg ok';
      renderSteps();
    } catch (err) {
      statusEl.textContent = err.message; statusEl.className = 'status-msg error';
    }
  }

  async function deleteStep(idx) {
    const step = state.steps[idx];
    if (step.dbId) {
      if (!confirm('Hapus langkah ini dari database?')) return;
      const res = await fetch(API + '/chunks/' + step.dbId, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { alert('Gagal hapus: ' + data.error); return; }
    }
    state.steps.splice(idx, 1);
    renderSteps();
  }

  checkAuth();
</script>
</body>
</html>

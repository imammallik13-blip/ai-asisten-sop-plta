<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Asisten SOP — PLTA Sipansihaporas</title>
<style>
  :root {
    --bg: #0e1a22;
    --panel: #142530;
    --panel-2: #1a2e3a;
    --border: #24404e;
    --text: #e7eef2;
    --muted: #85a0ac;
    --accent: #e3a008;
    --accent-dim: #7a5a12;
    --teal: #2fa6a0;
    --danger: #d9534f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, Segoe UI, Roboto, sans-serif;
  }

  @font-face {
    font-family: 'IBM Plex Mono';
    src: local('monospace');
  }

  .mono {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    letter-spacing: 0.02em;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* HEADER */
  header {
    flex-shrink: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .brand .eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    font-weight: 600;
  }

  .brand .title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 6px var(--teal);
  }

  select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    font-family: inherit;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* CHAT LOG */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 320px;
    padding: 24px;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

  .empty-state .mono {
    display: block;
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: 0.1em;
  }

  .msg {
    max-width: 86%;
    display: flex;
    flex-direction: column;
  }

  .msg.operator {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.ai {
    align-self: flex-start;
    align-items: flex-start;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .msg.operator .bubble {
    background: var(--teal);
    color: #06201e;
    border-bottom-right-radius: 3px;
  }

  .msg.ai .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-bottom-left-radius: 3px;
  }

  .msg.ai .readout-label {
    font-size: 10px;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }

  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .source-chip {
    font-size: 10.5px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 8px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .source-chip .doc-num {
    color: var(--teal);
    font-weight: 600;
  }

  .loading .bubble {
    color: var(--muted);
    font-style: italic;
  }

  .error-bubble {
    background: rgba(217, 83, 79, 0.12) !important;
    border-color: var(--danger) !important;
    border-left-color: var(--danger) !important;
    color: #f2b8b5 !important;
  }

  /* INPUT AREA */
  #input-bar {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  #question {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    max-height: 120px;
    line-height: 1.4;
  }

  #question:focus {
    outline: 2px solid var(--teal);
    outline-offset: -1px;
  }

  #send-btn {
    background: var(--accent);
    color: #241a03;
    border: none;
    border-radius: 8px;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }

  #send-btn:disabled {
    background: var(--accent-dim);
    color: #6b5a2e;
    cursor: not-allowed;
  }

  #send-btn:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 2px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <span class="eyebrow">AI Asisten SOP</span>
      <span class="title">PLTA Sipansihaporas</span>
    </div>
    <div class="header-right">
      <select id="unit-select">
        <option value="1|SPH">Sipansihaporas — Unit 1</option>
      </select>
      <div class="status" title="Terhubung">
        <span class="status-dot"></span>
      </div>
    </div>
  </header>

  <div id="log">
    <div class="empty-state" id="empty-state">
      <span class="mono">STANDBY</span>
      Tanyakan prosedur operasi, misalnya:<br>
      "Apa langkah sebelum unit start-up?"<br>
      Jawaban akan menyertakan rujukan IK.
    </div>
  </div>

  <div id="input-bar">
    <textarea id="question" rows="1" placeholder="Tulis pertanyaan..." aria-label="Pertanyaan operator"></textarea>
    <button id="send-btn" aria-label="Kirim pertanyaan">&#8593;</button>
  </div>

</div>

<script>
  const log = document.getElementById('log');
  const emptyState = document.getElementById('empty-state');
  const questionInput = document.getElementById('question');
  const sendBtn = document.getElementById('send-btn');
  const unitSelect = document.getElementById('unit-select');

  let sessionId = null;

  // Auto-grow textarea
  questionInput.addEventListener('input', () => {
    questionInput.style.height = 'auto';
    questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + 'px';
  });

  questionInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });

  sendBtn.addEventListener('click', sendQuestion);

  function addMessage(role, text) {
    if (emptyState) emptyState.remove();
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    msg.appendChild(bubble);
    log.appendChild(msg);
    log.scrollTop = log.scrollHeight;
    return { msg, bubble };
  }

  function addLoadingMessage() {
    const { msg, bubble } = addMessage('ai', 'Mencari rujukan IK...');
    msg.classList.add('loading');
    return msg;
  }

  function renderAiAnswer(container, answer, sources) {
    container.classList.remove('loading');
    container.innerHTML = '';

    const label = document.createElement('div');
    label.className = 'readout-label mono';
    label.textContent = 'AI ASISTEN';
    container.appendChild(label);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = answer;
    container.appendChild(bubble);

    if (sources && sources.length > 0) {
      const sourcesEl = document.createElement('div');
      sourcesEl.className = 'sources';
      sources.forEach((s) => {
        const chip = document.createElement('div');
        chip.className = 'source-chip mono';
        chip.innerHTML = '<span class="doc-num">' + s.nomor_ik + '</span> ' + (s.label || '');
        sourcesEl.appendChild(chip);
      });
      container.appendChild(sourcesEl);
    }

    log.scrollTop = log.scrollHeight;
  }

  function renderError(container, errorText) {
    container.classList.remove('loading');
    container.innerHTML = '';
    const bubble = document.createElement('div');
    bubble.className = 'bubble error-bubble';
    bubble.textContent = 'Gagal mendapatkan jawaban: ' + errorText;
    container.appendChild(bubble);
    log.scrollTop = log.scrollHeight;
  }

  async function sendQuestion() {
    const question = questionInput.value.trim();
    if (!question) return;

    const [unit, lokasi] = unitSelect.value.split('|');

    addMessage('operator', question);
    questionInput.value = '';
    questionInput.style.height = 'auto';
    sendBtn.disabled = true;

    const loadingMsg = addLoadingMessage();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, unit, lokasi, session_id: sessionId }),
      });

      const data = await res.json();

      if (!res.ok) {
        renderError(loadingMsg, data.error || ('HTTP ' + res.status));
      } else {
        sessionId = data.session_id;
        renderAiAnswer(loadingMsg, data.answer, data.sources);
      }
    } catch (err) {
      renderError(loadingMsg, err.message);
    } finally {
      sendBtn.disabled = false;
    }
  }
</script>
</body>
</html>
